name: Release

# ─── Triggers ──────────────────────────────────────────────────────────────
# Auto-release on version tags (v1.2.3) OR manual dispatch with a version input
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # pre-releases: v1.0.0-beta.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        default: 'v0.0.0-test'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'

# Only one release at a time; cancel older runs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod

jobs:
  # ─── 1. Resolve version & metadata ─────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      ldflags:    ${{ steps.meta.outputs.ldflags }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and flags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            PRE="${{ github.event.inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF_NAME}"   # e.g. v1.2.3
            # treat anything with a hyphen (v1.0.0-beta) as pre-release
            if echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
              PRE="true"
            else
              PRE="false"
            fi
          fi

          SEMVER="${VERSION#v}"
          LDFLAGS="-w -s \
            -X github.com/loom/loom/version.Version=${SEMVER} \
            -X github.com/loom/loom/server.mode=release"

          echo "version=${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}"     >> "$GITHUB_OUTPUT"
          echo "ldflags=${LDFLAGS}"   >> "$GITHUB_OUTPUT"

          echo "### Release ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pre-release: ${PRE}"   >> "$GITHUB_STEP_SUMMARY"

  # ─── 2. Build matrix ────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────────────────
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo: "1"
            apt_packages: "gcc libc6-dev"

          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cgo: "1"
            cc: aarch64-linux-gnu-gcc
            apt_packages: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross"

          - goos: linux
            goarch: arm
            goarm: "7"
            runner: ubuntu-latest
            cgo: "1"
            cc: arm-linux-gnueabihf-gcc
            apt_packages: "gcc-arm-linux-gnueabihf libc6-dev-armhf-cross"

          # ── Windows ────────────────────────────────────────────────────────
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            cgo: "0"             # pure Go for Windows cross-compile

          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
            cgo: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Install cross-compile dependencies
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Build binary
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          GOARM:       ${{ matrix.goarm || '' }}
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          CC:          ${{ matrix.cc || '' }}
        run: |
          set -euo pipefail
          LDFLAGS="${{ needs.setup.outputs.ldflags }}"
          BINARY="loom"
          [ "$GOOS" = "windows" ] && BINARY="loom.exe"

          echo "Building ${GOOS}/${GOARCH}${GOARM:+v$GOARM} ..."
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/${BINARY}" .

      - name: Package archive
        run: |
          set -euo pipefail
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          GOARM="${{ matrix.goarm || '' }}"
          VERSION="${{ needs.setup.outputs.version }}"

          ARCH_LABEL="${GOARCH}"
          [ -n "$GOARM" ] && ARCH_LABEL="${GOARCH}v${GOARM}"

          ARCHIVE_BASE="loom-${GOOS}-${ARCH_LABEL}"
          mkdir -p "release/${ARCHIVE_BASE}"

          if [ "$GOOS" = "windows" ]; then
            cp dist/loom.exe "release/${ARCHIVE_BASE}/"
            # Copy installer scripts
            cp install.ps1 "release/${ARCHIVE_BASE}/" 2>/dev/null || true
            cd release
            zip -r "../dist/${ARCHIVE_BASE}.zip" "${ARCHIVE_BASE}/"
            cd ..
            sha256sum "dist/${ARCHIVE_BASE}.zip" | awk '{print $1}' > "dist/${ARCHIVE_BASE}.zip.sha256"
          else
            cp dist/loom "release/${ARCHIVE_BASE}/"
            # Copy installer scripts and docs
            cp install.sh "release/${ARCHIVE_BASE}/" 2>/dev/null || true
            cp -r docs   "release/${ARCHIVE_BASE}/" 2>/dev/null || true
            tar -czf "dist/${ARCHIVE_BASE}.tar.gz" -C release "${ARCHIVE_BASE}/"
            sha256sum "dist/${ARCHIVE_BASE}.tar.gz" | awk '{print $1}' > "dist/${ARCHIVE_BASE}.tar.gz.sha256"
          fi

          echo "### Artifacts for ${GOOS}/${GOARCH}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/ >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/
          retention-days: 7

  # ─── 3. Create GitHub Release ───────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [setup, build]
    permissions:
      contents: write    # needed to create releases and upload assets
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: all-dist/
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "### All release assets" >> "$GITHUB_STEP_SUMMARY"
          find all-dist/ -type f | sort | while read f; do
            echo "- $(basename $f) ($(du -sh $f | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          SEMVER="${VERSION#v}"
          cat > release-notes.md <<EOF
          ## Loom ${VERSION}

          ### Installation

          **Linux / macOS** (auto-detects architecture):
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/tuhin-su/loom-master/main/install.sh | sh
          \`\`\`

          **Windows** (PowerShell, run as Administrator):
          \`\`\`powershell
          irm https://raw.githubusercontent.com/tuhin-su/loom-master/main/install.ps1 | iex
          \`\`\`

          **Pin this version:**
          \`\`\`bash
          VERSION=${VERSION} curl -fsSL .../install.sh | sh
          \`\`\`

          ### Manual Downloads

          | Platform | Architecture | Download |
          |----------|-------------|---------|
          | Linux    | amd64       | \`loom-linux-amd64.tar.gz\` |
          | Linux    | arm64       | \`loom-linux-arm64.tar.gz\` |
          | Linux    | arm (v7)    | \`loom-linux-armv7.tar.gz\` |
          | Windows  | amd64       | \`loom-windows-amd64.zip\`  |
          | Windows  | arm64       | \`loom-windows-arm64.zip\`  |

          All assets include a \`.sha256\` checksum file.

          ### What's New

          See [CHANGELOG](https://github.com/tuhin-su/loom-master/blob/main/CHANGELOG.md) for full details.

          ### New Features in This Fork

          - 🧠 **Native long-term memory** — Remembers users, projects, and preferences across sessions  
            See [docs/memory.md](https://github.com/tuhin-su/loom-master/blob/main/docs/memory.md)
          - 🔑 **Token authentication** — Secure local API with Bearer token  
            See [docs/server-config.md](https://github.com/tuhin-su/loom-master/blob/main/docs/server-config.md)
          - 📦 **One-command install** — \`install.sh\` / \`install.ps1\` with auto-arch detection
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.setup.outputs.version }}
          name:       "Loom ${{ needs.setup.outputs.version }}"
          body_file:  release-notes.md
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          draft:      false
          files: |
            all-dist/*.tar.gz
            all-dist/*.tar.gz.sha256
            all-dist/*.zip
            all-dist/*.zip.sha256
            install.sh
            install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 4. Post-release notification ──────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [setup, release]
    if: always()
    steps:
      - name: Summary
        run: |
          if [ "${{ needs.release.result }}" = "success" ]; then
            echo "## ✅ Release ${{ needs.setup.outputs.version }} published!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🔗 https://github.com/tuhin-su/loom-master/releases/tag/${{ needs.setup.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Release ${{ needs.setup.outputs.version }} FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi
